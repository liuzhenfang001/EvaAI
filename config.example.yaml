# EvaAI 主配置模板 —— 复制为 config.yaml 后按需修改。
# 值以 $ 开头会被解析为环境变量（来自 .env 或系统环境）。
config_version: 1
log_level: info

# 模型 profile。`use` 指向实现类；`model` 是发给 API 的模型名；其余键透传给构造函数。
#
# 用 `DeepSeekChatModel` 而不是 `langchain_openai:ChatOpenAI`：后者的三个落点都不处理
# DeepSeek 的 `reasoning_content`（它文档里明说不提取第三方厂商的非标准字段），于是思考内容
# 既回不到请求体、也到不了前端。见 docs/adr/0016。
models:
  - name: deepseek-flash
    use: evaharness.models.deepseek:DeepSeekChatModel
    model: deepseek-flash
    base_url: https://api.deepseek.com/v1
    api_key: $DEEPSEEK_API_KEY
    # 思考模式下 provider 会忽略 temperature（官方说明），留着是给「极速」模式用的。
    temperature: 0.0

# Checkpoint 持久化（SQLite）：保存每个 ReAct 任务图内部的 state，
# 供中断后排查与二期恢复使用。注意它**不保存编排进度**（见 docs/adr/0007）。
checkpoint:
  db_path: ./data/checkpoints.sqlite
  retention_days: 7   # 启动时清理最后活动早于 N 天的 thread；<=0 表示不清理

# RunJournal：把每次运行的完整 RunEvent 序列落盘，供前端按 run_id 回放（见 docs/adr/0008）。
# 它记录的是**编排器的事件流**，与 SSE 是同一份数据的两个消费者。
journal:
  store: evaharness.journal.stores:JsonlJournalStore   # 也可以是 :MemoryJournalStore（仅测试用）
  dir: ./data/journal                                   # 相对路径按项目根解析
  flush_threshold: 20                                   # 攒够多少条落一次盘（逐 token 落盘会拖慢实时流）

# Agent 层（T8 起默认路径是 ReAct 主 Agent，Plan-Exec 退到 /chat/plan/stream 封存）。
agent:
  # 会话摘要压缩：上下文超过阈值就把早先的消息压成一段摘要（见 docs/adr/0010）。
  # 阈值是**估算**的 token 数（不是 provider 报的用量），所以取一个离上限有安全距离的值。
  summarization:
    enabled: true
    trigger_tokens: 48000   # DeepSeek 上下文 64K，留出安全余量
    keep_messages: 20       # 尾部这么多条原样保留
    model: null             # 摘要用哪个模型 profile；null = 复用主模型

# 工具集（T4）。每一项是一个工具；`use` 是 "module.path:attr"，指向**两种东西之一**：
#   - 一个 BaseTool 实例（@tool 装饰过的函数就是）；
#   - 一个**工厂函数**，它吃下面那些额外键作为关键字参数，返回一个工具。
# 加一个工具 = 写一个 @tool（或工厂）+ 在下面加一项，不用改任何 Python 框架代码。
#
# `name` 必须与工具自己的 .name 一致，且全表不许重名——两者在**启动期**校验，写错就拒绝启动。
# 这一段**不能是空的**：工具是 agent 的能力边界，所以没有隐藏的默认集。
#
# 工具看到的路径是**虚拟路径**，宿主目录是 backend/.evaai/（见 docs/adr/0012）：
#   /workspace 工作台（相对路径的落点，可写）  /output 交付（可写）
#   /input     用户上传（只读）                /skills 技能文件（只读）
tools:
  - name: get_current_time
    use: app.tools.builtin:get_current_time

  # 文件沙箱内的读写与检索
  - name: ls
    use: app.tools.file_ops:ls
  - name: read_file
    use: app.tools.file_ops:read_file
  - name: write_file
    use: app.tools.file_ops:write_file
  - name: str_replace
    use: app.tools.file_ops:str_replace
  - name: glob
    use: app.tools.file_ops:glob
  - name: grep
    use: app.tools.file_ops:grep

  # 把 /output 下的成品交给用户：前端会显示成可下载的文件卡片，并随 journal 落盘（刷新后
  # 卡片仍在）。只放行 /output——/workspace 是工作台，它的内容不会出现在用户面前。
  - name: present_files
    use: app.tools.present_files:present_files

  # 联网。两个 key 都是可选的：搜索走 Tavily，不填 TAVILY_API_KEY 就用它的无 key 模式
  # （能用，但有速率上限）；抓取走 Jina Reader，JINA_API_KEY 同样可选。
  - name: web_search
    use: app.tools.web:make_web_search
    max_results: 5          # 这些额外键 = 工厂的关键字参数，在启动期绑进工具
    timeout: 20
  - name: web_fetch
    use: app.tools.web:make_web_fetch
    timeout: 10
    use_readability: false  # 打开会走 Node/Readability.js；本机缺它的 node_modules，会触发 npm install
