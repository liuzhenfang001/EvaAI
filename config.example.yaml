# EvaAI 主配置模板 —— 复制为 config.yaml 后按需修改。
# 值以 $ 开头会被解析为环境变量（来自 .env 或系统环境）。
config_version: 1
# 我们自己的日志级别（app.* / evaharness.* 两个命名空间；uvicorn 自己的日志另有其 --log-level）。
# debug / info / warning / error / critical，大小写不敏感；写错回落到 info 并记一条警告。
log_level: info

# 模型 profile。`use` 指向实现类；`model` 是发给 API 的模型名；其余键透传给构造函数。
#
# 用 `DeepSeekChatModel` 而不是 `langchain_openai:ChatOpenAI`：后者的三个落点都不处理
# DeepSeek 的 `reasoning_content`（它文档里明说不提取第三方厂商的非标准字段），于是思考内容
# 既回不到请求体、也到不了前端。见 docs/adr/0016。
models:
  - name: deepseek-flash
    use: evaharness.models.deepseek:DeepSeekChatModel
    model: deepseek-flash
    base_url: https://api.deepseek.com/v1
    api_key: $DEEPSEEK_API_KEY
    # 思考模式下 provider 会忽略 temperature（官方说明），留着是给「极速」模式用的。
    temperature: 0.0

# Checkpoint 持久化（SQLite）：保存每个 ReAct 任务图内部的 state，
# 供中断后排查与二期恢复使用。注意它**不保存编排进度**（见 docs/adr/0007）。
checkpoint:
  db_path: ./data/checkpoints.sqlite
  retention_days: 7   # 启动时清理最后活动早于 N 天的 thread；<=0 表示不清理

# RunJournal：把每次运行的完整 RunEvent 序列落盘，供前端按 run_id 回放（见 docs/adr/0008）。
# 它记录的是**编排器的事件流**，与 SSE 是同一份数据的两个消费者。
journal:
  store: evaharness.journal.stores:JsonlJournalStore   # 也可以是 :MemoryJournalStore（仅测试用）
  dir: ./data/journal                                   # 相对路径按项目根解析
  flush_threshold: 20                                   # 攒够多少条落一次盘（逐 token 落盘会拖慢实时流）

# Agent 层（T8 起默认路径是 ReAct 主 Agent，Plan-Exec 退到 /chat/plan/stream 封存）。
agent:
  # 会话摘要压缩：上下文超过阈值就把早先的消息压成一段摘要（见 docs/adr/0010）。
  # 阈值是**估算**的 token 数（不是 provider 报的用量），所以取一个离上限有安全距离的值。
  summarization:
    enabled: true
    trigger_tokens: 48000   # DeepSeek 上下文 64K，留出安全余量
    keep_messages: 20       # 尾部这么多条原样保留
    model: null             # 摘要用哪个模型 profile；null = 复用主模型

# 知识库（T18）：把仓库根 knowledge/ 下的文本切成片段、嵌入、存进本地 ChromaDB，
# 再由一个检索工具按需取用（命中片段写进 /workspace，只回路径）。见 docs/adr/0022。
#
# **模板里默认关**：打开它需要 DASHSCOPE_API_KEY（或换别的 OpenAI 兼容嵌入服务）。没 key 时
# enabled=true 会**拒绝启动**（这是显式配置错，不是「功能没开」）——所以新机器上先留 false。
#
# 源目录即真相：改 knowledge/ 里的文件后重启，启动期比对指纹、只对**改动过的文件**重建索引；
# 重建在后台跑，不拖慢启动。改嵌入模型 / 维度 / 切分参数会**整库重建**（配方记在库里，自动比对）。
#
# knowledge:
#   enabled: false
#   source: ./knowledge               # 相对路径按项目根解析
#   persist_dir: ./data/knowledge     # Chroma 的持久化**目录**（不是文件）
#   fingerprint_db_path: ./data/fingerprints.sqlite
#   embedding:
#     model: text-embedding-v4
#     base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
#     api_key: $DASHSCOPE_API_KEY
#     dimensions: 1024                # 必须与向量库建表维度一致
#     batch_size: 10                  # DashScope v4 每次最多 10 条
#   chunk_size: 800                   # 按字符切（中文一字约一 token）
#   chunk_overlap: 120
#   top_k: 4
#   fingerprint_mode: mtime           # mtime（快）| content（准）
#   ignore: []                        # fnmatch 通配符（匹配相对路径），如 ["drafts/*"]

# 长期记忆（T21）：跨会话记住关于用户的事——六块画像摘要 + 一条条原子事实，存在本地 SQLite。
# 写入是**被动**的：每轮结束后把「用户消息 + 最终回复」丢进去抖队列，安静 debounce_seconds 秒后
# 由抽取模型整理成画像与事实；模型手里只有 memory_search 用于按需检索。记忆在一个会话开头作为
# **隐藏消息**注入一次（不显示在对话记录里）。见 docs/adr/0025 / 0026。
#
# 默认关：打开它会给 lead 链多挂两个中间件、给模型多一件检索工具、每个会话多一段注入，并起一个
# 后台抽取队列。没有外部依赖，不需要任何 key。
#
# max_injection_tokens 是整段注入的预算（画像 + 事实），超了按优先级裁：guaranteed_categories
# 里的分类先占 guaranteed_token_budget 那条保底通道（记错的事会再犯，所以 correction 默认保底），
# 剩下给画像，再剩下给其余事实。
#
# memory:
#   enabled: false
#   db_path: ./data/memory.sqlite     # 相对路径按项目根解析
#   max_injection_tokens: 2000
#   guaranteed_categories: [correction]
#   guaranteed_token_budget: 500
#   debounce_seconds: 30              # 最后一轮对话之后安静多久才抽取
#   model: null                       # 抽取用的模型 profile；null = 主模型
#   extraction_timeout_seconds: 60
#   max_facts_in_prompt: 100
#   max_capture_turns: 20
#   min_capture_chars: 3

# 工具集（T4）。每一项是一个工具；`use` 是 "module.path:attr"，指向**两种东西之一**：
#   - 一个 BaseTool 实例（@tool 装饰过的函数就是）；
#   - 一个**工厂函数**，它吃下面那些额外键作为关键字参数，返回一个工具。
# 加一个工具 = 写一个 @tool（或工厂）+ 在下面加一项，不用改任何 Python 框架代码。
#
# `name` 必须与工具自己的 .name 一致，且全表不许重名——两者在**启动期**校验，写错就拒绝启动。
# 这一段**不能是空的**：工具是 agent 的能力边界，所以没有隐藏的默认集。
#
# 工具看到的路径是**虚拟路径**，宿主目录是 backend/.evaai/（见 docs/adr/0012）：
#   /workspace 工作台（相对路径的落点，可写）  /output 交付（可写）
#   /input     用户上传（只读）                /skills 技能文件（只读）
tools:
  - name: get_current_time
    use: app.tools.builtin:get_current_time

  # 文件沙箱内的读写与检索
  - name: ls
    use: evaharness.sandbox.file_ops:ls
  - name: read_file
    use: evaharness.sandbox.file_ops:read_file
  - name: write_file
    use: evaharness.sandbox.file_ops:write_file
  - name: str_replace
    use: evaharness.sandbox.file_ops:str_replace
  - name: glob
    use: evaharness.sandbox.file_ops:glob
  - name: grep
    use: evaharness.sandbox.file_ops:grep

  # 把 /output 下的成品交给用户：前端会显示成可下载的文件卡片，并随 journal 落盘（刷新后
  # 卡片仍在）。只放行 /output——/workspace 是工作台，它的内容不会出现在用户面前。
  - name: present_files
    use: app.tools.present_files:present_files

  # 联网。两个 key 都是可选的：搜索走 Tavily，不填 TAVILY_API_KEY 就用它的无 key 模式
  # （能用，但有速率上限）；抓取走 Jina Reader，JINA_API_KEY 同样可选。
  - name: web_search
    use: app.tools.web:make_web_search
    max_results: 5          # 这些额外键 = 工厂的关键字参数，在启动期绑进工具
    timeout: 20
  - name: web_fetch
    use: app.tools.web:make_web_fetch
    timeout: 10
    use_readability: false  # 打开会走 Node/Readability.js；本机缺它的 node_modules，会触发 npm install

  # bash（T15）：在**本会话私有**的 Linux 容器里执行 shell 命令（见 docs/adr/0019）。
  #
  # **模板里默认注释掉**：它要求本机装好 Docker Desktop 并**预先拉取**镜像。启用了却用不了
  # 的话，服务会**拒绝启动**（不静默降级）——所以没装 Docker 的机器不要取消注释。
  #
  # 容器内的 /workspace、/output、/input、/skills 与文件工具看到的是**同一份文件**，
  # 其中 /input 与 /skills 由 docker 强制只读。容器每会话一个、会一直留着（装过的包在会话里
  # 留存），容器名是 evaai-<会话 id>。
  #
  # - name: bash
  #   use: evaharness.sandbox.bash:make_bash
  #   # 也可以用 tag：enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:1.11.0
  #   image: sha256:6328d7fd2f0ff0b4c147c3d05b3df1ce331f4a482eb6e550ecd64ed1fcf906e7
  #   network: bridge     # bridge（默认）= 容器能出网；none = 断网
  #   timeout: 60         # 单条命令的秒数上限（容器内 timeout 是真边界，客户端的只是兜底）
  #   memory: 1g          # 内存上限；空串表示不设（与 swap 等值，不许靠 swap 吃穿上限）
  #   cpus: "2"           # CPU 上限；空串表示不设
  #   pids_limit: 512     # 进程数上限，防 fork 炸弹
