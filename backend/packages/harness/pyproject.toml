[project]
name = "evaharness"
version = "0.1.0"
description = "EvaAI agent harness framework (business-agnostic)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.0",
    "langchain>=1.3",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.9,<1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaharness"]
