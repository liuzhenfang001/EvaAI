[project]
name = "evaharness"
version = "0.1.0"
description = "EvaAI agent harness framework (business-agnostic)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.0",
    "langchain[mcp]>=1.3",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.9,<1.3",
    "langgraph-checkpoint-sqlite>=3.1",
    # 知识库（T18）的向量库。它自带一套存储与索引（嵌入式、零外部服务），代价是依赖树不轻。
    "chromadb>=1.5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaharness"]
