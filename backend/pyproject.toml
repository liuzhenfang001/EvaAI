[project]
name = "evaai"
version = "0.1.0"
description = "EvaAI - enterprise-grade personal AI assistant"
requires-python = ">=3.12"
dependencies = [
    "evaharness",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # 工具集的直接依赖（T4）。放 app 层而不是 harness：harness 是业务无关的机制层，
    # 「用哪个搜索 API、怎么把网页抽成正文」是业务决定——这一片框架层的依赖零增长。
    "httpx>=0.28.0",          # web_fetch 直连 Jina；自己 import 就得自己声明，不靠传递依赖
    "tavily-python>=0.7.17",  # web_search
    "readabilipy>=0.3.0",     # 正文抽取（自带 bs4 / html5lib / lxml / regex）
    "markdownify>=1.2.2",     # HTML → Markdown
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# T6「可测试」收口：每次测试都量 harness 层（evaharness）覆盖率，低于 80% 直接红。
# 当前 95%，留出足够余量；要看缺哪几行，单跑 `uv run pytest --cov-report=term-missing`。
addopts = "--cov=evaharness --cov-fail-under=80"

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
evaharness = { workspace = true }
