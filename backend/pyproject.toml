[project]
name = "evaai"
version = "0.1.0"
description = "EvaAI - enterprise-grade personal AI assistant"
requires-python = ">=3.12"
dependencies = [
    "evaharness",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
evaharness = { workspace = true }
